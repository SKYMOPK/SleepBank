<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宿舍帳本</title>
    <link rel="icon" href="data:,">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="split-core.js"></script>
    <style>
        :root {
            --bg: #1E1912;
            --card: #2C2418;
            --text: #F2EBD8;
            --muted: #9E8F7C;
            --border: rgba(200,160,100,0.22);
            --orange: #C8A44A;
            --green: #76A668;
            --red: #C47070;
            --blue: #8FAEC8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(200,160,100,0.2); border-radius: 3px; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(ellipse at top left, #302818 0%, #1E1912 60%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .page-wrapper { max-width: 560px; margin: 0 auto; }

        /* ===== Header ===== */
        .header {
            background: rgba(28, 22, 14, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border);
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: var(--orange); }
        .header-back {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            color: var(--muted); text-decoration: none; font-size: 14px; font-weight: bold;
            transition: color 0.2s;
        }
        .header-back:hover { color: var(--text); }
        .header-right {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
        }

        /* ===== View 切換 ===== */
        .view { display: none; }
        .view.active { display: block; animation: fadeInUp 0.35s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ===== 淨額大字 ===== */
        .balance-card {
            margin: 20px 16px 0;
            background: rgba(44, 36, 22, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.3s;
        }
        .balance-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200,160,80,0.30), transparent);
        }
        .balance-label { font-size: 12px; color: var(--muted); letter-spacing: 1px; margin-bottom: 12px; }
        .balance-amount { font-size: 56px; font-weight: 900; line-height: 1; transition: color 0.4s; }
        .balance-desc { font-size: 14px; font-weight: 600; margin-top: 12px; transition: color 0.4s; opacity: 0.85; }
        .balance-amount.owe { color: var(--red); filter: drop-shadow(0 4px 12px rgba(196,112,112,0.25)); }
        .balance-amount.owed { color: var(--orange); filter: drop-shadow(0 4px 12px rgba(200,164,74,0.25)); }
        .balance-amount.zero { color: var(--green); filter: drop-shadow(0 4px 12px rgba(118,166,104,0.20)); }

        /* ===== 輸入卡 ===== */
        .input-card {
            margin: 14px 16px 0;
            background: rgba(44, 36, 22, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px 20px;
        }
        .input-card-title { font-size: 12px; font-weight: bold; color: var(--muted); letter-spacing: 0.5px; margin-bottom: 16px; }
        .input-card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
        .input-card-header .input-card-title { margin-bottom: 0; }
        .calc-toggle {
            border: 1px solid rgba(200,164,74,0.22); background: rgba(200,164,74,0.08);
            color: var(--orange); border-radius: 12px; padding: 8px 11px;
            font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .calc-toggle:hover, .calc-toggle.active { background: rgba(200,164,74,0.15); border-color: rgba(200,164,74,0.38); }
        .calc-panel {
            display: none; margin: -2px 0 14px; padding: 12px;
            border: 1px solid rgba(200,160,100,0.12); border-radius: 16px;
            background: rgba(0,0,0,0.16);
        }
        .calc-panel.open { display: block; animation: fadeInUp 0.2s ease-out; }
        .calc-display-row { display: grid; grid-template-columns: 1fr 88px; gap: 8px; }
        .calc-input, .calc-result {
            min-width: 0; border: 1px solid rgba(200,160,100,0.12); border-radius: 12px;
            background: rgba(0,0,0,0.18); color: var(--text); font-weight: bold;
        }
        .calc-input { width: 100%; padding: 11px 12px; font-size: 17px; text-align: right; outline: none; }
        .calc-input:focus { border-color: rgba(200,164,74,0.45); box-shadow: 0 0 0 3px rgba(200,164,74,0.07); }
        .calc-result { display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; color: var(--orange); font-size: 15px; }
        .calc-keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .calc-key, .calc-fill-btn {
            border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.035);
            color: var(--text); border-radius: 11px; font-weight: bold; cursor: pointer; transition: all 0.18s;
        }
        .calc-key { height: 38px; font-size: 15px; }
        .calc-key:hover, .calc-fill-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.12); }
        .calc-key.operator { color: var(--orange); background: rgba(200,164,74,0.08); border-color: rgba(200,164,74,0.18); }
        .calc-key.muted { color: var(--muted); }
        .calc-key.equals { color: var(--green); background: rgba(118,166,104,0.08); border-color: rgba(118,166,104,0.18); }
        .calc-key.wide { grid-column: span 2; }
        .calc-fill-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .calc-fill-btn { padding: 10px; color: var(--orange); font-size: 13px; }
        .calc-hint { margin-top: 8px; color: rgba(255,255,255,0.28); font-size: 11px; text-align: center; }
        .amount-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .amount-group label { font-size: 12px; color: var(--muted); font-weight: bold; display: block; margin-bottom: 6px; letter-spacing: 0.5px; }
        .amount-input {
            width: 100%; background: rgba(0,0,0,0.20); border: 1px solid rgba(200,160,100,0.12);
            border-radius: 12px; padding: 14px 12px; color: var(--text);
            font-size: 20px; font-weight: bold; text-align: center;
            outline: none; transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none;
        }
        .amount-input:focus { border-color: rgba(200,164,74,0.5); box-shadow: 0 0 0 3px rgba(200,164,74,0.08); }
        .amount-input::placeholder { color: rgba(255,255,255,0.18); font-size: 16px; font-weight: normal; }
        .note-input {
            width: 100%; background: rgba(0,0,0,0.20); border: 1px solid rgba(200,160,100,0.12);
            border-radius: 12px; padding: 12px 14px; color: var(--text);
            font-size: 15px; outline: none; margin-bottom: 14px; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .note-input:focus { border-color: rgba(200,164,74,0.5); box-shadow: 0 0 0 3px rgba(200,164,74,0.08); }
        .note-input::placeholder { color: rgba(255,255,255,0.2); }
        .payer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        .payer-btn {
            padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03); color: var(--muted);
            font-size: 14px; font-weight: bold; cursor: pointer; transition: all 0.25s; text-align: center;
        }
        .payer-btn:hover { background: rgba(255,255,255,0.06); color: var(--text); }
        .payer-btn.selected {
            border-color: rgba(255,179,64,0.45); background: rgba(255,179,64,0.1);
            color: var(--orange); box-shadow: 0 0 18px rgba(255,179,64,0.15);
        }
        .preview-text { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 14px; min-height: 18px; font-weight: 600; transition: color 0.2s; }
        .preview-text.has-value { color: var(--orange); }
        .submit-btn {
            width: 100%; padding: 16px; border-radius: 16px;
            border: 1px solid rgba(255,179,64,0.35); background: rgba(255,179,64,0.12);
            color: var(--orange); font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.25s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .submit-btn:hover { background: rgba(255,179,64,0.2); box-shadow: 0 6px 22px rgba(255,179,64,0.2); transform: translateY(-2px); }
        .submit-btn:active { transform: scale(0.97) translateY(0); }
        .submit-btn:disabled { opacity: 0.38; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ===== 查看帳目按鈕 ===== */
        .view-records-btn {
            display: flex; align-items: center; justify-content: space-between;
            margin: 12px 16px 0; padding: 16px 20px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.025);
            color: var(--muted); cursor: pointer; font-size: 15px; font-weight: bold;
            transition: all 0.2s; backdrop-filter: blur(10px);
        }
        .view-records-btn:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .view-records-btn:active { background: rgba(255,255,255,0.07); }
        .view-records-badge {
            background: var(--red); color: white; font-size: 11px; font-weight: bold;
            padding: 2px 8px; border-radius: 10px; display: none; opacity: 0.85;
        }

        /* ===== 紀錄 View ===== */
        .balance-mini {
            margin: 20px 16px 0;
            background: rgba(22, 26, 42, 0.65); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 18px; padding: 18px 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .balance-mini-label { font-size: 13px; color: var(--muted); font-weight: bold; }
        .balance-mini-amount { font-size: 22px; font-weight: 900; }
        .balance-mini-amount.owed { color: var(--orange); }
        .balance-mini-amount.owe { color: var(--red); }
        .balance-mini-amount.zero { color: var(--green); }
        .balance-mini-desc { font-size: 12px; color: var(--muted); margin-top: 2px; text-align: right; }

        .settle-card { margin: 12px 16px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .settle-btn {
            padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.07);
            background: rgba(255,255,255,0.025); color: var(--muted);
            font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: center;
        }
        .settle-btn.primary { background: rgba(74,222,128,0.08); border-color: rgba(74,222,128,0.25); color: var(--green); }
        .settle-btn.primary:hover  { background: rgba(74,222,128,0.16); box-shadow: 0 6px 18px rgba(74,222,128,0.15); transform: translateY(-2px); }
        .settle-btn.secondary { background: rgba(123,156,255,0.08); border-color: rgba(123,156,255,0.22); color: var(--blue); }
        .settle-btn.secondary:hover { background: rgba(123,156,255,0.16); transform: translateY(-2px); }
        .settle-btn:active { transform: scale(0.97) translateY(0); }

        .list-section { margin: 14px 16px 0; }
        .tab-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .tab-btn {
            flex: 1; padding: 11px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.07);
            background: rgba(255,255,255,0.025); color: var(--muted);
            font-size: 13px; font-weight: bold; cursor: pointer; transition: all 0.2s; text-align: center;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .tab-btn.active { background: rgba(255,179,64,0.1); border-color: rgba(255,179,64,0.3); color: var(--orange); }
        .tab-badge {
            background: rgba(248,113,113,0.8); color: white; font-size: 10px; font-weight: bold;
            padding: 1px 6px; border-radius: 8px; min-width: 18px; text-align: center;
        }

        /* ===== 紀錄卡片 ===== */
        .record-card {
            background: rgba(22, 26, 42, 0.55);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px; padding: 16px; margin-bottom: 10px;
            display: flex; align-items: flex-start; gap: 14px;
            transition: border-color 0.25s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.25s cubic-bezier(0.25, 1, 0.5, 1), transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }
        .record-card:hover { border-color: rgba(255,255,255,0.13); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .record-card:active { transform: scale(0.992); }
        .record-card.settled { opacity: 0.72; }
        .record-checkbox {
            width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; flex-shrink: 0;
            display: grid; place-items: center; margin: -8px 0 0 -8px; position: relative;
        }
        .record-checkbox::before { content:''; width:22px; height:22px; border-radius:6px; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.03); transition:all 0.22s cubic-bezier(0.25, 1, 0.5, 1); }
        .record-checkbox.checked::before { background: var(--blue); border-color: var(--blue); box-shadow:0 0 14px rgba(143,174,200,0.25); }
        .record-checkbox.checked::after { content: '✓'; position:absolute; color: white; font-size: 13px; font-weight: bold; }
        .record-body { flex: 1; min-width: 0; }
        .record-note { font-weight: bold; font-size: 15px; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .record-amounts { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
        .record-payer-tag {
            display: inline-block; font-size: 11px; font-weight: bold; padding: 2px 8px;
            border-radius: 6px; background: rgba(255,179,64,0.1); color: var(--orange);
            border: 1px solid rgba(255,179,64,0.22); margin-bottom: 4px;
        }
        .record-result { font-size: 14px; font-weight: bold; color: var(--orange); }
        .record-result.zero { color: var(--green); }
        .record-time { font-size: 11px; color: rgba(255,255,255,0.25); text-align: right; white-space: nowrap; flex-shrink: 0; padding-top: 3px; }
        .empty-state { text-align: center; color: rgba(255,255,255,0.2); padding: 40px 20px; font-size: 14px; line-height: 2; }

        /* ===== Toast ===== */
        #toast {
            position: fixed; top: 80px; left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(20, 24, 38, 0.95); border: 1px solid rgba(255,255,255,0.1);
            border-left: 4px solid var(--green); color: var(--text);
            padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: bold;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); opacity: 0; transition: all 0.3s;
            pointer-events: none; white-space: nowrap; z-index: 9999;
            backdrop-filter: blur(10px);
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        @media (max-width: 480px) { .balance-amount { font-size: 44px; } }

        /* ===== 確認 Modal ===== */
        .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 500; align-items: center; justify-content: center; padding: 20px; }
        .confirm-overlay.show { display: flex; }
        .confirm-box { background: rgba(18, 22, 36, 0.96); border: 1px solid rgba(255,255,255,0.12); border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 360px; text-align: center; animation: fadeInUp 0.25s ease-out; backdrop-filter: blur(20px); }
        .confirm-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
        .confirm-body { font-size: 14px; color: var(--muted); line-height: 1.8; margin-bottom: 24px; }
        .confirm-body strong { color: var(--text); }
        .confirm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .confirm-cancel { padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: var(--muted); font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .confirm-cancel:hover { background: rgba(255,255,255,0.08); color: var(--text); }
        .confirm-ok { padding: 14px; border-radius: 14px; border: 1px solid rgba(255,179,64,0.4); background: rgba(255,179,64,0.12); color: var(--orange); font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .confirm-ok:hover { background: rgba(255,179,64,0.2); }
        .confirm-ok.danger { border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.1); color: var(--red); }
        .confirm-ok.danger:hover { background: rgba(248,113,113,0.2); }

        /* ===== 逐筆刪除按鈕 ===== */
        .record-delete-btn { flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px; border: 1px solid rgba(248,113,113,0.18); background: rgba(248,113,113,0.05); color: rgba(248,113,113,0.4); font-size: 15px; cursor: pointer; transition: all 0.2s; align-self: center; display: flex; align-items: center; justify-content: center; }
        .record-delete-btn:hover { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.4); color: var(--red); }

        /* ===== 搜尋、月份與批次操作 ===== */
        .record-tools { margin: 14px 16px 0; display: grid; grid-template-columns: minmax(0,1fr) 128px 112px; gap: 8px; }
        .record-search, .record-filter {
            min-width:0; height:42px; border:1px solid rgba(255,255,255,0.09); border-radius:12px;
            background:rgba(0,0,0,0.18); color:var(--text); padding:0 12px; outline:none;
            font-size:13px; font-weight:700; transition:border-color .22s cubic-bezier(0.25, 1, 0.5, 1), box-shadow .22s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .record-search:focus, .record-filter:focus { border-color:rgba(200,164,74,0.45); box-shadow:0 0 0 3px rgba(200,164,74,0.07); }
        .record-filter option { background:#211b13; color:var(--text); }
        .filter-result { margin:9px 18px 0; color:var(--muted); font-size:11px; min-height:16px; }
        .month-group { margin-bottom:18px; }
        .month-heading {
            width:100%; min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:12px;
            border:0; border-bottom:1px solid rgba(255,255,255,0.08); background:transparent; color:var(--text);
            padding:8px 2px; margin-bottom:10px; cursor:pointer; text-align:left;
        }
        .month-heading strong { font-size:13px; }
        .month-heading span { color:var(--muted); font-size:11px; text-align:right; }
        .month-heading i { color:var(--orange); font-size:12px; font-style:normal; transition:transform .24s cubic-bezier(0.25, 1, 0.5, 1); }
        .month-group.collapsed .month-heading i { transform:rotate(-90deg); }
        .month-records { display:block; }
        .month-group.collapsed .month-records { display:none; }
        .selection-bar {
            position:sticky; bottom:12px; z-index:80; display:none; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px;
            margin:14px 16px 0; padding:12px 14px; border:1px solid rgba(143,174,200,0.32); border-radius:16px;
            background:rgba(25,28,35,0.94); backdrop-filter:blur(18px); box-shadow:0 12px 35px rgba(0,0,0,0.4);
        }
        .selection-bar.show { display:grid; animation:fadeInUp .28s cubic-bezier(0.25, 1, 0.5, 1); }
        .selection-bar strong { display:block; color:var(--blue); font-size:13px; }
        .selection-bar span { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
        .selection-bar button { height:40px; border:1px solid rgba(143,174,200,0.35); border-radius:12px; background:rgba(143,174,200,0.12); color:var(--blue); padding:0 15px; font-weight:900; cursor:pointer; }
        .settlement-heading { margin:12px 0 10px; padding:12px 2px 8px; border-bottom:1px solid rgba(118,166,104,0.2); }
        .settlement-heading strong { display:block; color:var(--green); font-size:13px; }
        .settlement-heading span { display:block; color:var(--muted); font-size:11px; margin-top:4px; }

        /* ===== 編輯帳目與復原 ===== */
        .edit-overlay { display:none; position:fixed; inset:0; z-index:600; align-items:flex-end; justify-content:center; padding:16px; background:rgba(0,0,0,0.72); backdrop-filter:blur(10px); }
        .edit-overlay.show { display:flex; }
        .edit-sheet { width:100%; max-width:480px; border:1px solid rgba(255,255,255,0.12); border-radius:22px; background:rgba(28,25,22,0.98); padding:20px; box-shadow:0 24px 70px rgba(0,0,0,0.6); animation:sheetIn .3s cubic-bezier(0.25, 1, 0.5, 1); }
        @keyframes sheetIn { from { opacity:0; transform:translate3d(0,28px,0) scale(.98); } to { opacity:1; transform:translate3d(0,0,0) scale(1); } }

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyB567-hOy8kSYC3KNTomBty0oZmFRHN8ng",

        databaseURL: "https://accounting-system-53ed3-default-rtdb.firebaseio.com",
        projectId: "accounting-system-53ed3",
        storageBucket: "accounting-system-53ed3.firebasestorage.app",
        messagingSenderId: "76627672581",
        appId: "1:76627672581:web:5e1ead01e77cade980e66c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const ledgerCore = window.SplitLedgerCore;
    const playerNames = { p1: '至凱', p2: '柏致' };

    let currentBalance = 0;
    let currentPayer = null;
    let allRecords = {};
    let allSettlements = {};
    let selectedKeys = new Set();
    let currentView = 'input';
    let calcValue = 0;
    let editingKey = null;
    let editorPayer = null;
    let lastUndoAction = null;
    let undoTimer = null;
    let recordsLoaded = false;
    let isSubmitting = false;
    const syncingBudgetKeys = new Map();
    const collapsedMonths = new Set();
    const initializedMonthGroups = new Set();
    const recordFilters = {
        unsettled: { search: '', month: 'all', payer: 'all' },
        settled: { search: '', month: 'all', payer: 'all' },
    };

    // ===== View 切換 =====
    function handleBack() {
        if (currentView === 'unsettled' || currentView === 'settled') switchView('input');
        else window.location.href = 'index.html';
    }

    const viewTitles = { input: '📒 帳本', unsettled: '📋 未結清', settled: '🗂️ 已結清' };

    function switchView(v) {
        currentView = v;
        ['input', 'unsettled', 'settled'].forEach(id => {
            const el = document.getElementById('view-' + id);
            if (el) el.classList.toggle('active', v === id);
        });
        document.getElementById('headerTitle').innerText = viewTitles[v] || '📒 帳本';
        if (v === 'unsettled' || v === 'settled') renderList();
        window.scrollTo(0, 0);
    }

    // ===== 工具 =====
    // ===== 🔊 音效引擎 =====
    const _ac = new (window.AudioContext || window.webkitAudioContext)();
    function _tone(freq, vol, delay, dur) {
        if (_ac.state === 'suspended') _ac.resume();
        const osc = _ac.createOscillator(), gain = _ac.createGain();
        osc.connect(gain); gain.connect(_ac.destination);
        osc.type = 'sine'; osc.frequency.value = freq;
        const t = _ac.currentTime + delay;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(vol, t + 0.018);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.start(t); osc.stop(t + dur + 0.05);
    }
    function playSound(type) {
        if (type === 'click')   { _tone(380, 0.045, 0, 0.07); }
        else if (type === 'open')    { _tone(440, 0.07, 0, 0.20); _tone(554, 0.05, 0.10, 0.28); }
        else if (type === 'close')   { _tone(554, 0.06, 0, 0.14); _tone(415, 0.04, 0.09, 0.22); }
        else if (type === 'add')     { _tone(659, 0.09, 0, 0.25); _tone(784, 0.07, 0.12, 0.32); }
        else if (type === 'success') { _tone(523, 0.11, 0, 0.40); _tone(659, 0.09, 0.13, 0.45); _tone(784, 0.07, 0.26, 0.55); }
        else if (type === 'remove')  { _tone(320, 0.07, 0, 0.22); }
        else if (type === 'error')   { _tone(260, 0.09, 0, 0.18); _tone(210, 0.07, 0.15, 0.26); }
    }

    // 全域按鈕點擊音
    document.addEventListener('click', e => {
        if (e.target.closest('.submit-btn, .settle-btn, .tab-btn, .payer-btn, .view-records-btn, .confirm-cancel, .header-back, .calc-toggle, .calc-key, .calc-fill-btn'))
            playSound('click');
    });


    function showToast(msg, color = 'var(--green)') {
        if (color === 'var(--red)') playSound('error');
        const el = document.getElementById('toast');
        el.innerText = msg;
        el.style.borderLeftColor = color;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2500);
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
    }

    function operationId(prefix = 'op') {
        return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;
    }

    function offerUndo(message, action) {
        clearTimeout(undoTimer);
        lastUndoAction = action;
        document.getElementById('undoText').innerText = message;
        document.getElementById('undoToast').classList.add('show');
        undoTimer = setTimeout(clearUndo, 6000);
    }

    function clearUndo() {
        clearTimeout(undoTimer);
        undoTimer = null;
        lastUndoAction = null;
        document.getElementById('undoToast').classList.remove('show');
    }

    async function undoLastAction() {
        if (!lastUndoAction) return;
        const action = lastUndoAction;
        clearUndo();
        try {
            await action();
            playSound('success');
            showToast('↩️ 已復原');
        } catch (error) {
            console.error(error);
            showToast('復原失敗，請檢查網路', 'var(--red)');
        }
    }

    function formatTime(ts) {
        const d = new Date(ts);
        const mo = d.getMonth() + 1, da = d.getDate();
        const hh = String(d.getHours()).padStart(2,'0'), mm = String(d.getMinutes()).padStart(2,'0');
        return `${mo}/${da} ${hh}:${mm}`;
    }

    function getDelta(r) {
        return ledgerCore.recordDelta(r);
    }

    function getResultText(r) {
        const delta = getDelta(r);
        if (delta > 0) return `柏致還至凱 $${delta}`;
        if (delta < 0) return `至凱還柏致 $${Math.abs(delta)}`;
        return '不產生欠款';
    }

    function dateKey(ts = Date.now()) {
        return ledgerCore.dateKeyFromTimestamp(ts);
    }
    function monthKeyFromDate(dateStr) { return dateStr.slice(0, 7); }
    function daysInMonthKey(monthKey) {
        const [y, m] = monthKey.split('-').map(Number);
        return new Date(y, m, 0).getDate();
    }
    function addDays(dateStr, n) {
        const d = new Date(dateStr + 'T00:00:00');
        d.setDate(d.getDate() + n);
        return dateKey(d.getTime());
    }
    function settleBudgetState(state) {
        if (!state || !state.monthKey) return state;
        const today = dateKey();
        const currentMonth = monthKeyFromDate(today);
        let b = { ...state };
        let vault = Number(b.vault) || 0;
        if (b.monthKey !== currentMonth) {
            if (b.lastSettledDate && b.monthBudget > 0) {
                const limit = Number(b.monthBudget || 0) / daysInMonthKey(b.monthKey);
                let d = b.lastSettledDate;
                while (monthKeyFromDate(d) === b.monthKey) {
                    vault += limit - (d === b.lastSettledDate ? Number(b.spentToday || 0) : 0);
                    d = addDays(d, 1);
                }
            }
            return { monthKey: currentMonth, monthBudget: 0, locked: false, vault, spentToday: 0, lastSettledDate: today, updatedAt: Date.now(), splitOps: b.splitOps || {} };
        }
        if (!b.lastSettledDate) b.lastSettledDate = today;
        if (b.lastSettledDate < today && b.monthBudget > 0) {
            const limit = Number(b.monthBudget || 0) / daysInMonthKey(b.monthKey);
            let d = b.lastSettledDate;
            while (d < today && monthKeyFromDate(d) === b.monthKey) {
                vault += limit - (d === b.lastSettledDate ? Number(b.spentToday || 0) : 0);
                d = addDays(d, 1);
            }
            b.spentToday = 0;
            b.lastSettledDate = today;
        }
        b.vault = Math.round(vault * 100) / 100;
        b.updatedAt = Date.now();
        return b;
    }
    function compactSplitOps(ops = {}, nextId, timestamp) {
        const entries = Object.entries({ ...ops, [nextId]: timestamp })
            .sort((a, b) => Number(b[1]) - Number(a[1]))
            .slice(0, 120);
        return Object.fromEntries(entries);
    }

    function applyBudgetAdjustment(uid, delta, appliedDate, opId) {
        const amountDelta = ledgerCore.roundMoney(delta);
        if (amountDelta === 0) return Promise.resolve();
        const spendDate = appliedDate || dateKey();
        return db.ref('budget/' + uid).transaction(raw => {
            if (!raw || !raw.monthKey) return raw;
            const b = settleBudgetState(raw);
            if (!b || !b.monthKey) return b;
            if (b.splitOps && b.splitOps[opId]) return b;
            if (spendDate === dateKey() && b.monthKey === monthKeyFromDate(spendDate)) {
                b.spentToday = Math.max(0, ledgerCore.roundMoney(Number(b.spentToday || 0) + amountDelta));
            } else {
                b.vault = ledgerCore.roundMoney(Number(b.vault || 0) - amountDelta);
            }
            const now = Date.now();
            b.splitOps = compactSplitOps(b.splitOps, opId, now);
            b.updatedAt = now;
            return b;
        });
    }

    async function applyBudgetSync(sync) {
        const before = sync.before ? { budgetApplied: sync.before } : null;
        const after = sync.after ? { budgetApplied: sync.after } : null;
        const adjustments = ledgerCore.budgetAdjustments(before, after);
        await Promise.all(adjustments.map(adjustment => applyBudgetAdjustment(
            adjustment.playerId,
            adjustment.delta,
            adjustment.date,
            `${sync.opId}:${adjustment.playerId}:${adjustment.date}`
        )));
    }

    async function reconcileRecordBudget(key, record) {
        const sync = record && record.budgetSync;
        if (!sync) return;
        if (syncingBudgetKeys.has(key)) return syncingBudgetKeys.get(key);
        const task = (async () => {
        try {
            await applyBudgetSync(sync);
            await db.ref('split/records/' + key).transaction(current => {
                if (!current || !current.budgetSync || current.budgetSync.opId !== sync.opId) return;
                if (sync.deleteAfterSync) return null;
                const cleaned = { ...current };
                delete cleaned.budgetSync;
                return cleaned;
            });
        } catch (error) {
            console.error(error);
            showToast('⚠️ 每日額度同步待重試', 'var(--red)');
            throw error;
        } finally {
            if (syncingBudgetKeys.get(key) === task) syncingBudgetKeys.delete(key);
        }
        })();
        syncingBudgetKeys.set(key, task);
        return task;
    }

    async function commitRecordChange(key, beforeRecord, afterRecord) {
        const opId = operationId('budget');
        const before = ledgerCore.budgetSnapshot(beforeRecord);
        const after = ledgerCore.budgetSnapshot(afterRecord);
        const pending = afterRecord
            ? { ...afterRecord, budgetSync: { opId, before, after, createdAt: Date.now() } }
            : { ...beforeRecord, deletedAt: Date.now(), budgetSync: { opId, before, after: null, deleteAfterSync: true, createdAt: Date.now() } };
        await db.ref('split/records/' + key).set(pending);
        await reconcileRecordBudget(key, pending);
    }

    function parseCalcExpression(raw) {
        const expr = raw.replace(/,/g, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
        let i = 0;

        function skipSpaces() { while (expr[i] === ' ') i++; }
        function parseNumber() {
            skipSpaces();
            const start = i;
            while (/[0-9.]/.test(expr[i] || '')) i++;
            if (start === i) throw new Error('number expected');
            const text = expr.slice(start, i);
            if ((text.match(/\./g) || []).length > 1) throw new Error('invalid number');
            return Number(text);
        }
        function parseFactor() {
            skipSpaces();
            const ch = expr[i];
            if (ch === '+') { i++; return parseFactor(); }
            if (ch === '-') { i++; return -parseFactor(); }
            if (ch === '(') {
                i++;
                const value = parseExpression();
                skipSpaces();
                if (expr[i] !== ')') throw new Error('missing )');
                i++;
                return value;
            }
            return parseNumber();
        }
        function parseTerm() {
            let value = parseFactor();
            while (true) {
                skipSpaces();
                const op = expr[i];
                if (op !== '*' && op !== '/') break;
                i++;
                const right = parseFactor();
                value = op === '*' ? value * right : value / right;
            }
            return value;
        }
        function parseExpression() {
            let value = parseTerm();
            while (true) {
                skipSpaces();
                const op = expr[i];
                if (op !== '+' && op !== '-') break;
                i++;
                const right = parseTerm();
                value = op === '+' ? value + right : value - right;
            }
            return value;
        }

        if (!expr.trim()) return 0;
        const value = parseExpression();
        skipSpaces();
        if (i < expr.length || !Number.isFinite(value)) throw new Error('invalid expression');
        return value;
    }

    function formatCalcValue(value) {
        const rounded = Math.round((value + Number.EPSILON) * 100) / 100;
        return Number.isInteger(rounded) ? String(rounded) : String(rounded).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
    }

    function updateCalculator() {
        const input = document.getElementById('calcExpr');
        const result = document.getElementById('calcResult');
        try {
            calcValue = parseCalcExpression(input.value);
            result.innerText = '$' + formatCalcValue(calcValue);
            result.style.color = calcValue < 0 ? 'var(--red)' : 'var(--orange)';
            return true;
        } catch (e) {
            calcValue = null;
            result.innerText = '錯誤';
            result.style.color = 'var(--red)';
            return false;
        }
    }

    async function performSettlement(entries, mode, summary) {
        const settlementRef = db.ref('split/settlements').push();
        const settlementId = settlementRef.key;
        const now = Date.now();
        const recordIds = Object.fromEntries(entries.map(([key]) => [key, true]));
        const updates = {
            [`settlements/${settlementId}`]: {
                timestamp: now,
                mode,
                amount: summary.amount,
                from: summary.from,
                to: summary.to,
                count: entries.length,
                recordIds,
            },
        };
        entries.forEach(([key]) => {
            updates[`records/${key}/settled`] = true;
            updates[`records/${key}/settledAt`] = now;
            updates[`records/${key}/settlementId`] = settlementId;
        });
        try {
            await db.ref('split').update(updates);
            selectedKeys.clear();
            updateSelectionBar();
            playSound('success');
            offerUndo(mode === 'all' ? '全部帳目已結清' : '選取帳目已結清', async () => {
                const undoUpdates = { [`settlements/${settlementId}/undoneAt`]: Date.now() };
                entries.forEach(([key]) => {
                    undoUpdates[`records/${key}/settled`] = false;
                    undoUpdates[`records/${key}/settledAt`] = null;
                    undoUpdates[`records/${key}/settlementId`] = null;
                });
                await db.ref('split').update(undoUpdates);
            });
        } catch (error) {
            console.error(error);
            showToast('結清失敗，請檢查網路', 'var(--red)');
        }
    }

    function renderList() {
        const makeCard = (k, r) => {
            const delta = getDelta(r);
            const payerName = r.payer === 'p1' ? '至凱' : '柏致';
            const isChecked = selectedKeys.has(k);
            const amountsText = [r.p1_bought ? `至凱 $${r.p1_bought}` : '', r.p2_bought ? `柏致 $${r.p2_bought}` : ''].filter(Boolean).join('　');
            const selectable = !r.settled && !r.budgetSync;
            const deleteBtn = selectable ? `<button class="record-delete-btn" onclick="event.stopPropagation();confirmDeleteRecord('${k}')" title="刪除此筆" aria-label="刪除此筆">✕</button>` : '';
            const syncText = r.budgetSync ? ' · 同步中' : '';
            return `
            <div class="record-card${r.settled ? ' settled' : ''}" data-record-key="${escapeHtml(k)}" onclick="openRecordEditor('${k}')">
                ${selectable ? `<button class="record-checkbox${isChecked ? ' checked' : ''}" type="button" onclick="event.stopPropagation();toggleSelect('${k}', this)" aria-label="${isChecked ? '取消選取' : '選取'} ${escapeHtml(r.note)}"></button>` : '<div style="width:36px;flex-shrink:0;"></div>'}
                <div class="record-body">
                    <div class="record-note">${escapeHtml(r.note)}</div>
                    <div class="record-amounts">${amountsText}</div>
                    <div><span class="record-payer-tag">💳 ${payerName}付${syncText}</span></div>
                    <div class="record-result${delta === 0 ? ' zero' : ''}">${getResultText(r)}</div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;">
                    <div class="record-time">${formatTime(r.timestamp)}</div>
                    ${deleteBtn}
                </div>
            </div>`;
        };

        const renderSettledBatch = entries => {
            const batches = new Map();
            entries.forEach(entry => {
                const batchId = entry[1].settlementId || 'legacy';
                if (!batches.has(batchId)) batches.set(batchId, []);
                batches.get(batchId).push(entry);
            });
            return [...batches.entries()].map(([batchId, batchEntries]) => {
                const settlement = batchId === 'legacy' ? null : allSettlements[batchId];
                const summary = ledgerCore.settlementSummary(batchEntries);
                const heading = settlement
                    ? `<div class="settlement-heading"><strong>${settlementInstruction(settlement)}</strong><span>${formatTime(settlement.timestamp)} · ${settlement.count || batchEntries.length} 筆</span></div>`
                    : `<div class="settlement-heading"><strong>舊結清紀錄</strong><span>${batchEntries.length} 筆 · ${settlementInstruction(summary)}</span></div>`;
                return heading + batchEntries.map(([key, record]) => makeCard(key, record)).join('');
            }).join('');
        };

        const renderGroups = (kind, entries) => ledgerCore.groupRecordsByMonth(entries).map(group => {
            const token = `${kind}:${group.key}`;
            if (!initializedMonthGroups.has(token)) {
                initializedMonthGroups.add(token);
                if (group.key !== ledgerCore.monthKeyFromTimestamp()) collapsedMonths.add(token);
            }
            const collapsed = collapsedMonths.has(token);
            const content = kind === 'settled' ? renderSettledBatch(group.records) : group.records.map(([key, record]) => makeCard(key, record)).join('');
            return `<section class="month-group${collapsed ? ' collapsed' : ''}" data-month="${group.key}">
                <button class="month-heading" type="button" onclick="toggleMonthGroup('${kind}','${group.key}')">
                    <strong>${group.label}</strong><span>${group.count} 筆 · 淨額 ${formatBalanceShort(group.balance)}</span><i>⌄</i>
                </button>
                <div class="month-records">${content}</div>
            </section>`;
        }).join('');

        const unsettledEntries = ledgerCore.filterRecords(allRecords, { ...recordFilters.unsettled, settled: false });
        const settledEntries = ledgerCore.filterRecords(allRecords, { ...recordFilters.settled, settled: true });
        const uList = document.getElementById('record-list-unsettled');
        const sList = document.getElementById('record-list-settled');
        if (uList) uList.innerHTML = unsettledEntries.length ? renderGroups('unsettled', unsettledEntries) : '<div class="empty-state">📭 沒有符合條件的未結清帳目</div>';
        if (sList) sList.innerHTML = settledEntries.length ? renderGroups('settled', settledEntries) : '<div class="empty-state">📭 沒有符合條件的已結清紀錄</div>';
        document.getElementById('uFilterResult').innerText = `顯示 ${unsettledEntries.length} 筆`;
        document.getElementById('sFilterResult').innerText = `顯示 ${settledEntries.length} 筆`;
        updateSelectionBar();
    }

    function toggleSelect(key, el) {
        if (selectedKeys.has(key)) { selectedKeys.delete(key); el.classList.remove('checked'); }
        else { selectedKeys.add(key); el.classList.add('checked'); }
        el.setAttribute('aria-label', `${selectedKeys.has(key) ? '取消選取' : '選取'} ${allRecords[key]?.note || '帳目'}`);
        updateSelectionBar();
    }

    function formatBalanceShort(balance) {
        if (balance > 0) return `柏致欠至凱 $${balance}`;
        if (balance < 0) return `至凱欠柏致 $${Math.abs(balance)}`;
        return '互不相欠';
    }

    function updateSelectionBar() {
        const entries = [...selectedKeys]
            .map(key => [key, allRecords[key]])
            .filter(([, record]) => record && !record.settled && !record.deletedAt && !record.budgetSync);
        selectedKeys = new Set(entries.map(([key]) => key));
        const bar = document.getElementById('selectionBar');
        bar.classList.toggle('show', entries.length > 0);
        document.getElementById('selectionCount').innerText = `已選 ${entries.length} 筆`;
        document.getElementById('selectionSummary').innerText = entries.length ? settlementInstruction(ledgerCore.settlementSummary(entries)) : '不影響目前欠款';
    }

    function toggleMonthGroup(kind, month) {
        const token = `${kind}:${month}`;
        if (collapsedMonths.has(token)) collapsedMonths.delete(token);
        else collapsedMonths.add(token);
        renderList();
    }

    function setRecordFilter(kind, field, value) {
        recordFilters[kind][field] = value;
        if (field === 'month' && value !== 'all') collapsedMonths.delete(`${kind}:${value}`);
        if (kind === 'unsettled') selectedKeys.clear();
        renderList();
    }

    function syncMonthFilters() {
        const monthsByKind = {
            unsettled: ledgerCore.filterRecords(allRecords, { settled: false }),
            settled: ledgerCore.filterRecords(allRecords, { settled: true }),
        };
        for (const [kind, entries] of Object.entries(monthsByKind)) {
            const select = document.getElementById(kind === 'unsettled' ? 'uMonth' : 'sMonth');
            const current = recordFilters[kind].month;
            const months = [...new Set(entries.map(([, record]) => ledgerCore.monthKeyFromTimestamp(record.timestamp)))].sort().reverse();
            select.innerHTML = '<option value="all">全部月份</option>' + months.map(month => `<option value="${month}">${ledgerCore.monthLabel(month)}</option>`).join('');
            if (months.includes(current)) select.value = current;
            else {
                recordFilters[kind].month = 'all';
                select.value = 'all';
            }
        }
    }

    // ===== Firebase 監聽 =====
    function updateBalanceUI(bal) {
        // 輸入頁大字
        const amountEl = document.getElementById('balanceAmount');
        const descEl = document.getElementById('balanceDesc');
        // 紀錄頁小卡
        const miniEl = document.getElementById('balanceAmountMini');
        const miniDesc = document.getElementById('balanceDescMini');
        // badge
        const badge = document.getElementById('unsettled-badge');

        if (bal > 0) {
            amountEl.className = 'balance-amount owed'; amountEl.innerText = `$${bal}`;
            descEl.className = 'balance-desc owed'; descEl.innerText = '柏致欠至凱';
            miniEl.className = 'balance-mini-amount owed'; miniEl.innerText = `$${bal}`;
            miniDesc.innerText = '柏致欠至凱';
        } else if (bal < 0) {
            amountEl.className = 'balance-amount owe'; amountEl.innerText = `$${Math.abs(bal)}`;
            descEl.className = 'balance-desc owe'; descEl.innerText = '至凱欠柏致';
            miniEl.className = 'balance-mini-amount owe'; miniEl.innerText = `$${Math.abs(bal)}`;
            miniDesc.innerText = '至凱欠柏致';
        } else {
            amountEl.className = 'balance-amount zero'; amountEl.innerText = '$0';
            descEl.className = 'balance-desc zero'; descEl.innerText = '互不相欠 ✓';
            miniEl.className = 'balance-mini-amount zero'; miniEl.innerText = '$0';
            miniDesc.innerText = '互不相欠 ✓';
        }
        updatePreview();
    }

    let storedBalance = null;
    db.ref('split/balance').on('value', snap => {
        storedBalance = ledgerCore.roundMoney(snap.val() || 0);
    });

    db.ref('split/records').on('value', snap => {
        allRecords = snap.val() || {};
        recordsLoaded = true;
        document.body.dataset.recordsLoaded = 'true';
        currentBalance = ledgerCore.balanceFromRecords(allRecords);
        updateBalanceUI(currentBalance);
        if (storedBalance !== currentBalance) {
            storedBalance = currentBalance;
            db.ref('split/balance').set(currentBalance).catch(error => console.error(error));
        }
        const unsettledCount = ledgerCore.filterRecords(allRecords, { settled: false }).length;
        const badge = document.getElementById('unsettled-badge');
        badge.innerText = unsettledCount;
        badge.style.display = unsettledCount > 0 ? 'inline-block' : 'none';
        syncMonthFilters();
        if (currentView === 'unsettled' || currentView === 'settled') renderList();
        Object.entries(allRecords).forEach(([key, record]) => {
            if (record && record.budgetSync) reconcileRecordBudget(key, record).catch(() => {});
        });
    });

    db.ref('split/settlements').on('value', snap => {
        allSettlements = snap.val() || {};
        if (currentView === 'settled') renderList();
    });

    db.ref('.info/connected').on('value', snap => {
        const connected = snap.val() === true;
        const pill = document.getElementById('syncPill');
        pill.className = `sync-pill ${connected ? 'online' : 'offline'}`;
        pill.innerText = connected ? '已同步' : '離線';
    });

    updatePreview();

</script>

</body>
</html>
