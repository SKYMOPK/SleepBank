<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宿舍系統</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg: #1E1912;
            --card: #2C2418;
            --border: rgba(200,160,100,0.22);
            --text: #F2EBD8;
            --muted: #9E8F7C;
            --p1: #8DC87A;
            --p2: #7ABBC8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .icon-sprite {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }
        .icon {
            width: 1em;
            height: 1em;
            display: inline-block;
            flex: 0 0 auto;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            vertical-align: middle;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(ellipse at top, #302818 0%, #1E1912 60%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 32px;
        }

        /* ── Header ── */
        .header {
            width: 100%;
            max-width: 420px;
            padding: 28px 20px 0;
            text-align: center;
        }
        .header-icon {
            width: 70px;
            height: 70px;
            animation: float 3s ease-in-out infinite;
            display: grid;
            place-items: center;
            margin: 0 auto 12px;
            color: #F2D98A;
            border: 1px solid rgba(242,217,138,0.28);
            border-radius: 22px;
            background: rgba(200,160,100,0.09);
            box-shadow: 0 12px 30px rgba(0,0,0,0.18), inset 0 1px rgba(255,255,255,0.04);
        }
        .header-icon .icon {
            width: 38px;
            height: 38px;
            stroke-width: 1.65;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        .header-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .header-sub {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .time-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(200,160,100,0.06);
            border: 1px solid var(--border);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--p1);
            animation: blink 1s infinite alternate;
            flex-shrink: 0;
        }
        @keyframes blink {
            from { opacity: 1; box-shadow: 0 0 5px var(--p1); }
            to   { opacity: 0.3; box-shadow: none; }
        }

        /* ── Announcement ── */
        .anno-card {
            display: none;
            width: calc(100% - 40px);
            max-width: 420px;
            margin: 16px 0 0;
            padding: 12px 16px 12px 20px;
            border-radius: 14px;
            background: rgba(28,22,14,0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(200,160,100,0.2);
            position: relative;
            overflow: hidden;
            animation: slideDown 0.4s ease-out;
        }
        @keyframes slideDown {
            from { opacity:0; transform:translateY(-8px); }
            to   { opacity:1; transform:translateY(0); }
        }
        .anno-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--anno-accent, #BF8F42);
            border-radius: 0 2px 2px 0;
        }
        .anno-inner { display: flex; align-items: flex-start; gap: 10px; }
        .anno-icon  {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            color: var(--anno-accent, #BF8F42);
            border: 1px solid color-mix(in srgb, var(--anno-accent, #BF8F42) 34%, transparent);
            border-radius: 9px;
            background: color-mix(in srgb, var(--anno-accent, #BF8F42) 10%, transparent);
        }
        .anno-icon .icon { width: 17px; height: 17px; }
        .anno-title { font-weight: 700; font-size: 13px; color: var(--text); }
        .anno-text  { font-size: 12px; color: rgba(239,232,216,0.6); line-height: 1.5; margin-top: 2px; }
        .anno-date  { font-size: 10px; color: var(--muted); margin-left: auto; flex-shrink: 0; padding-left: 8px; }

        /* ── Section label ── */
        .section {
            width: calc(100% - 40px);
            max-width: 420px;
            margin-top: 22px;
        }
        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 10px;
        }

        /* ── Player cards (side by side) ── */
        .player-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 12px;
            border-radius: 20px;
            text-decoration: none;
            border: 1px solid var(--border);
            background: rgba(44,36,22,0.70);
            transition: all 0.2s;
            gap: 8px;
        }
        .player-card:hover  { transform: translateY(-4px); filter: brightness(1.12); }
        .player-card:active { transform: scale(0.97); }
        .player-card .p-ico  {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            border: 1px solid currentColor;
            background: rgba(255,255,255,0.035);
            box-shadow: inset 0 1px rgba(255,255,255,0.06);
        }
        .player-card .p-ico .icon { width: 31px; height: 31px; stroke-width: 1.65; }
        .player-card .p-name { font-size: 16px; font-weight: 900; }
        .player-card .p-sub  { font-size: 11px; color: var(--muted); }
        .card-p1 { border-color: rgba(141,200,122,0.3); color: var(--p1); }
        .card-p1:hover { box-shadow: 0 8px 24px rgba(141,200,122,0.12); border-color: rgba(141,200,122,0.5); }
        .card-p2 { border-color: rgba(122,187,200,0.3); color: var(--p2); }
        .card-p2:hover { box-shadow: 0 8px 24px rgba(122,187,200,0.12); border-color: rgba(122,187,200,0.5); }

        /* ── Hover Dashboard Panel ── */
        .hp-panel {
            position: absolute;
            bottom: calc(100% + 8px);
            left: -1px; right: -1px;
            background: rgba(20,16,10,0.97);
            border: 1px solid rgba(200,160,100,0.28);
            border-radius: 16px;
            padding: 10px 14px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
            transition: max-height 0.42s cubic-bezier(0.4,0,0.2,1),
                        opacity   0.30s ease,
                        transform 0.36s cubic-bezier(0.4,0,0.2,1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 20;
            box-shadow: 0 -6px 28px rgba(0,0,0,0.5);
        }
        .player-card:hover .hp-panel {
            max-height: 200px;
            opacity: 1;
            transform: translateY(0);
        }
        .hp-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid rgba(200,160,100,0.08);
            font-size: 12px;
            gap: 8px;
        }
        .hp-row:last-child { border-bottom: none; }
        .hp-lbl {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-weight: 500;
            white-space: nowrap;
        }
        .hp-lbl .icon { width: 14px; height: 14px; }
        .hp-val { font-weight: 700; color: var(--text); text-align: right; }

        /* ── Feature grid (2×2) ── */
        .feature-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .feature-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 16px;
            border-radius: 18px;
            text-decoration: none;
            border: 1px solid var(--border);
            background: rgba(44,36,22,0.70);
            transition: all 0.2s;
            gap: 6px;
        }
        .feature-card:hover  { transform: translateY(-3px); filter: brightness(1.12); }
        .feature-card:active { transform: scale(0.97); }
        .feature-card .f-ico  {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(var(--feature-rgb),0.28);
            border-radius: 12px;
            background: rgba(var(--feature-rgb),0.1);
            box-shadow: inset 0 1px rgba(255,255,255,0.04);
        }
        .feature-card .f-ico .icon { width: 23px; height: 23px; stroke-width: 1.7; }
        .feature-card .f-name { font-size: 14px; font-weight: 800; }
        .feature-card .f-sub  { font-size: 11px; color: var(--muted); line-height: 1.4; }

        .feat-split    { --feature-rgb: 200,164,74; border-color: rgba(200,164,74,0.3);  color: #C8A44A; }
        .feat-split:hover  { box-shadow: 0 6px 20px rgba(200,164,74,0.12); border-color: rgba(200,164,74,0.5); }
        .feat-grip     { --feature-rgb: 196,140,80; border-color: rgba(196,140,80,0.3);  color: #C48C50; }
        .feat-grip:hover   { box-shadow: 0 6px 20px rgba(196,140,80,0.12); border-color: rgba(196,140,80,0.5); }
        .feat-budget   { --feature-rgb: 118,166,104; border-color: rgba(118,166,104,0.3); color: #76A668; }
        .feat-budget:hover { box-shadow: 0 6px 20px rgba(118,166,104,0.12); border-color: rgba(118,166,104,0.5); }
        .feat-defense  { --feature-rgb: 181,154,216; border-color: rgba(150,128,184,0.34); color: #B59AD8; }
        .feat-defense:hover { box-shadow: 0 6px 20px rgba(150,128,184,0.16); border-color: rgba(181,154,216,0.58); }
        /* ── Changelog button ── */
        .changelog-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .changelog-btn:hover { color: var(--text); border-color: rgba(200,160,100,0.45); background: rgba(200,160,100,0.06); }
        .changelog-btn .icon { width: 15px; height: 15px; }
        .changelog-dot {
            position: absolute;
            top: -3px; right: -3px;
            width: 9px; height: 9px;
            background: #C47070;
            border-radius: 50%;
            border: 2px solid #1E1912;
            display: none;
            animation: dotPulse 1.8s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(196,112,112,0.5); }
            50% { box-shadow: 0 0 0 4px rgba(196,112,112,0); }
        }
        .changelog-dot.show { display: block; }

        /* ── Changelog bottom sheet ── */
        .cl-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(6px);
            z-index: 500;
            align-items: flex-end;
            justify-content: center;
        }
        .cl-overlay.open { display: flex; }
        .cl-sheet {
            width: 100%; max-width: 480px;
            max-height: 78vh;
            background: #2C2418;
            border-radius: 24px 24px 0 0;
            border: 1px solid rgba(200,160,100,0.25);
            border-bottom: none;
            display: flex;
            flex-direction: column;
            animation: sheetUp 0.3s cubic-bezier(0.25,0.8,0.25,1);
        }
        @keyframes sheetUp {
            from { transform: translateY(100%); opacity: 0.6; }
            to   { transform: translateY(0);    opacity: 1; }
        }
        .cl-handle {
            width: 38px; height: 4px;
            background: rgba(200,160,100,0.25);
            border-radius: 2px;
            margin: 12px auto 0;
            flex-shrink: 0;
        }
        .cl-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px 12px;
            border-bottom: 1px solid rgba(200,160,100,0.18);
            flex-shrink: 0;
        }
        .cl-title {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .cl-title .icon { width: 18px; height: 18px; color: #C8A44A; }
        .cl-close {
            width: 36px; height: 36px; color: var(--muted); cursor: pointer;
            display: grid; place-items: center;
            background: none; border: none; padding: 0; line-height: 1;
            border-radius: 8px; transition: background 0.15s;
        }
        .cl-close .icon { width: 18px; height: 18px; }
        .cl-close:hover { background: rgba(255,255,255,0.07); color: var(--text); }
        .cl-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 32px;
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .cl-entry { padding: 14px 0; }
        .cl-version-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .cl-ver-badge {
            font-size: 11px; font-weight: 800;
            padding: 3px 10px; border-radius: 10px;
            background: rgba(191,143,66,0.15);
            border: 1px solid rgba(191,143,66,0.35);
            color: #C8A44A;
        }
        .cl-date { font-size: 11px; color: var(--muted); }
        .cl-new-badge {
            font-size: 10px; font-weight: 800;
            padding: 2px 8px; border-radius: 8px;
            background: rgba(196,112,112,0.15);
            color: #C47070;
            border: 1px solid rgba(196,112,112,0.3);
            letter-spacing: 0.3px;
        }
        .cl-group { margin-bottom: 10px; }
        .cl-group-title {
            font-size: 12px; font-weight: 700;
            color: var(--muted);
            margin-bottom: 6px;
            display: flex; align-items: center; gap: 7px;
        }
        .cl-group-title .icon { width: 16px; height: 16px; color: #C8A44A; }
        .cl-items { list-style: none; display: flex; flex-direction: column; gap: 5px; }
        .cl-item {
            font-size: 13px;
            color: rgba(242,235,216,0.82);
            padding-left: 14px;
            position: relative;
            line-height: 1.5;
        }
        .cl-item::before { content: '·'; position: absolute; left: 4px; color: var(--muted); }
        .cl-divider { height: 1px; background: rgba(200,160,100,0.14); }

        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        body > *:not(#bg-canvas):not(.cl-overlay) { position: relative; z-index: 1; }
    </style>
    <link rel="stylesheet" href="system-ui.css">
    <style>
        .sb-index .entry-paused { cursor: not-allowed; opacity: .58; }
        .sb-index .entry-paused:hover,
        .sb-index .entry-paused:active { transform: none; filter: none; box-shadow: none; }
        .sb-index .entry-paused .hp-panel { display: none; }
        .sb-index .entry-paused, .sb-index .section:has(.player-grid) { display: none; }
        .sb-index .feat-budget { grid-column: 1 / -1; }
    </style>
</head>

<canvas id="bg-canvas"></canvas>

    <!-- Header -->
    <div class="header">
        <div class="header-icon" aria-hidden="true"><svg class="icon"><use href="#icon-home"></use></svg></div>
        <div class="header-title">宿舍系統</div>
        <div class="header-sub">帳務、預算與日常紀錄</div>
        <div class="time-pill">
            <div class="dot"></div>
            <span id="clock">載入中...</span>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
            <button class="changelog-btn" onclick="openChangelog()">

    <script>
    (function () {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // ── 星點 ──────────────────────────────────────
        const STAR_COUNT = 130;
        const stars = Array.from({ length: STAR_COUNT }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 1.1 + 0.25,
            vx: (Math.random() - 0.5) * 0.06,
            vy: (Math.random() - 0.5) * 0.06,
            phase: Math.random() * Math.PI * 2,
            speed: 0.012 + Math.random() * 0.018,
            base:  0.25 + Math.random() * 0.5,
        }));

        // ── 浮動粒子 ──────────────────────────────────
        const COLORS = ['rgba(242,217,138,', 'rgba(200,164,74,', 'rgba(141,200,122,', 'rgba(122,187,200,'];
        const PART_COUNT = 22;
        function mkParticle() {
            return {
                x: Math.random() * window.innerWidth,
                y: window.innerHeight + 10,
                r: 1.2 + Math.random() * 2,
                vx: (Math.random() - 0.5) * 0.18,
                vy: -(0.08 + Math.random() * 0.14),
                alpha: 0,
                peak: 0.25 + Math.random() * 0.35,
                life: 0,
                maxLife: 250 + Math.random() * 350,
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
            };
        }
        const particles = Array.from({ length: PART_COUNT }, () => {
            const p = mkParticle();
            p.y = Math.random() * window.innerHeight;
            p.life = Math.random() * p.maxLife;
            p.alpha = p.peak * 0.5;
            return p;
        });

        // ── 流星 ──────────────────────────────────────
        let shooters = [];
        let nextShoot = 2000 + Math.random() * 4000;

        function spawnShooter() {
            const angle = (22 + Math.random() * 28) * Math.PI / 180;
            const spd   = 9 + Math.random() * 7;
            return {
                x:    Math.random() * window.innerWidth  * 0.75,
                y:    Math.random() * window.innerHeight * 0.35,
                vx:   Math.cos(angle) * spd,
                vy:   Math.sin(angle) * spd,
                tail: 90 + Math.random() * 80,
                life: 0,
                max:  55 + Math.floor(Math.random() * 20),
            };
        }

        // ── 主循環 ────────────────────────────────────
        let last = 0;
        function frame(now) {
            const dt = now - last; last = now;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 星點
            for (const s of stars) {
                s.x += s.vx; s.y += s.vy; s.phase += s.speed;
                if (s.x < 0) s.x = canvas.width;
                if (s.x > canvas.width)  s.x = 0;
                if (s.y < 0) s.y = canvas.height;
                if (s.y > canvas.height) s.y = 0;
                const a = s.base * (0.55 + 0.45 * Math.sin(s.phase));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(242,235,216,${a.toFixed(3)})`;
                ctx.fill();
            }

            // 浮動粒子
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life++;
                const prog = p.life / p.maxLife;
                p.alpha = prog < 0.15 ? p.peak * (prog / 0.15)
                        : prog > 0.75 ? p.peak * ((1 - prog) / 0.25)
                        : p.peak;
                if (p.life >= p.maxLife) {
                    particles[i] = mkParticle();
                    continue;
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = p.color + p.alpha.toFixed(3) + ')';
                ctx.fill();
            }

            // 流星計時
            nextShoot -= dt;
            if (nextShoot <= 0) {
                shooters.push(spawnShooter());
                nextShoot = 3500 + Math.random() * 5500;
            }

            // 流星繪製
            shooters = shooters.filter(s => {
                s.x += s.vx; s.y += s.vy; s.life++;
                const a = Math.max(0, 1 - s.life / s.max);
                const spd = Math.hypot(s.vx, s.vy);
                const tx  = s.x - (s.vx / spd) * s.tail;
                const ty  = s.y - (s.vy / spd) * s.tail;
                const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
                g.addColorStop(0,   `rgba(255,240,200,${a.toFixed(3)})`);
                g.addColorStop(0.3, `rgba(255,220,160,${(a * 0.5).toFixed(3)})`);
                g.addColorStop(1,   'rgba(255,220,160,0)');
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(tx, ty);
                ctx.strokeStyle = g;
                ctx.lineWidth = 1.8;
                ctx.stroke();
                return s.life < s.max;
            });

            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    })();
    </script>
